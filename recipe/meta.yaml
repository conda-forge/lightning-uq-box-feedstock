{% set name = "lightning-uq-box" %}
{% set version = "0.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 9a714ec771e5c7aa86fbe245a2b9485f2d49e44df506a9df37c262f91238cad3

build:
  entry_points:
    - uq-box = lightning_uq_box.main:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - uv-build >=0.7,<0.13
    - pip
  run:
    - python >={{ python_min }}
    - einops >=0.3
    - lightning >=2.4
    - matplotlib-base >=3.7.3
    - numpy >=1.26
    - pandas >=2.1.1
    - pytorch >=2.0
    - torchmetrics >=1.2
    - torchvision >=0.16.1
    - scikit-learn >=1.3
    - gpytorch >=1.11
    - laplace-torch >=0.2.2.2
    - curvlinops-for-pytorch ==2.0.0
    - uncertainty-toolbox >=0.1.1
    - kornia >=0.6.9
    - timm >=1.0
    - segmentation-models-pytorch >=0.5.0
    - h5py >=3.12.1
    - ema_pytorch >=0.7

    # Required by LightningCLI
    - jsonargparse >=4.28.0
    - omegaconf >=2.3

test:
  imports:
    - lightning_uq_box
  commands:
    # pip check is skipped: lightning-uq-box requires vbll, which is not
    # packaged on conda-forge (PyPI only).
    - uq-box --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/lightning-uq-box/lightning-uq-box
  summary: 'Lighning-UQ-Box: A toolbox for uncertainty quantification in deep learning'
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - nilsleh
    - adamjstewart
